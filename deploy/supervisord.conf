; Process manager for the single Hugging Face Space container.
; Programs are started in order by deploy/entrypoint.sh (autostart=false) and restarted if they crash.

[unix_http_server]
file=/tmp/neural_forge_supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=10MB
logfile_backups=1
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/neural_forge_supervisor.sock

[program:vllm_reasoning]
command=/bin/bash /app/deploy/run_vllm.sh reasoning
directory=/app
autostart=false
autorestart=true
startsecs=20
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vllm_consultant]
command=/bin/bash /app/deploy/run_vllm.sh consultant
directory=/app
autostart=false
autorestart=true
startsecs=20
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/bin/bash /app/deploy/run_api.sh
directory=/app
autostart=false
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
